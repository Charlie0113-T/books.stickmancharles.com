<svg viewBox="0 0 720 296" role="img" data-caption="图 6 · 电话簿：把名字翻回门牌号" aria-label="示意图：DNS 像一本全世界共用的电话簿，把域名翻译成 IP 地址；下面列出 A、CNAME、TXT、MX 四种常见记录，以及改了 DNS 不马上生效的原因。">
  <text class="ts" x="40" y="42">域名 Domain · 人记得住的名字</text>
  <rect class="s" x="40" y="54" width="220" height="54" rx="2"/>
  <text class="tm" x="60" y="86">books.stickmancharles.com</text>

  <rect class="s" x="310" y="40" width="110" height="82" rx="2"/>
  <line class="s s2" x1="365" y1="40" x2="365" y2="122"/>
  <line class="s s3" x1="324" y1="62" x2="352" y2="62"/>
  <line class="s s3" x1="324" y1="82" x2="352" y2="82"/>
  <line class="s s3" x1="324" y1="102" x2="352" y2="102"/>
  <line class="s s3" x1="378" y1="62" x2="406" y2="62"/>
  <line class="s s3" x1="378" y1="82" x2="406" y2="82"/>
  <line class="s s3" x1="378" y1="102" x2="406" y2="102"/>
  <text class="t" x="365" y="144" text-anchor="middle">DNS · 全世界共用的电话簿</text>

  <text class="ts" x="470" y="42">IP 地址 · 机器认的门牌号</text>
  <rect class="s" x="470" y="54" width="210" height="54" rx="2"/>
  <text class="tm" x="490" y="86">76.76.21.21</text>

  <line class="s" x1="264" y1="81" x2="304" y2="81"/>
  <polyline class="s" points="296,76 304,81 296,86"/>
  <line class="s" x1="424" y1="81" x2="464" y2="81"/>
  <polyline class="s" points="456,76 464,81 456,86"/>

  <line class="s s3" x1="40" y1="168" x2="680" y2="168"/>
  <text class="tm" x="40" y="192">A</text>
  <text class="ts" x="120" y="192">名字指向一个 IP：它住在这台机器</text>
  <text class="tm" x="380" y="192">CNAME</text>
  <text class="ts" x="470" y="192">名字指向另一个名字</text>
  <text class="tm" x="40" y="222">TXT</text>
  <text class="ts" x="120" y="222">名片上贴张便签：证明这域名归我</text>
  <text class="tm" x="380" y="222">MX</text>
  <text class="ts" x="470" y="222">发给这域名的邮件往哪送</text>
  <line class="s s3" x1="40" y1="238" x2="680" y2="238"/>

  <text class="ts" x="40" y="262">改完不马上生效：全世界无数份缓存副本要按各自的 TTL 陆续更新，这个过程叫传播</text>
  <text class="mk" x="700" y="286" text-anchor="end">stickmancharles.com · CC BY-NC-ND 4.0</text>
</svg>
