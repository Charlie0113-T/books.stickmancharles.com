  <circle class="s" cx="180" cy="140" r="6"/>
  <circle class="s" cx="260" cy="140" r="6"/>
  <circle class="s" cx="340" cy="140" r="6"/>
  <circle class="s" cx="540" cy="140" r="6"/>
  <circle class="s" cx="620" cy="140" r="6"/>

  <path class="s" d="M260,140 C 300,140 300,88 340,88"/>
  <circle class="s" cx="400" cy="88" r="6"/>
  <circle class="s" cx="460" cy="88" r="6"/>
  <line class="s" x1="346" y1="88" x2="394" y2="88"/>
  <line class="s" x1="406" y1="88" x2="454" y2="88"/>
  <path class="s" d="M466,88 C 506,88 506,140 540,140"/>

  <text class="ts" x="100" y="166" text-anchor="middle">commit 存档点</text>
  <text class="t" x="400" y="68" text-anchor="middle">branch · 开一个平行存档，去试危险打法</text>
  <text class="ts" x="400" y="110" text-anchor="middle">试崩了，整条扔掉，无事发生</text>
  <text class="ts" x="562" y="166">merge 合回主线</text>

  <path class="s s3 d" d="M620,154 C 500,206 300,206 186,156"/>
  <polyline class="s s3" points="192,164 184,154 195,153"/>
  <text class="ts" x="400" y="222" text-anchor="middle">想回到任何一个存档点，随时可以</text>
  <text class="ts" x="40" y="248">平时三招傍身：git status（改了什么还没存档） · git log --oneline（存档历史） · git diff（这次改了什么）</text>
