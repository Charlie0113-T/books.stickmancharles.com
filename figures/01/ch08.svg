<svg viewBox="0 0 720 282" role="img" data-caption="图 8 · 时间机器：存档点、平行存档、合回主线" aria-label="示意图：Git 的主线上一串 commit 存档点，中间开出一条 branch 平行存档去试危险打法，试成了 merge 合回主线，试崩了整条扔掉，任何时候都能回到某个存档点。">
  <text class="tm" x="60" y="126">main</text>
  <line class="s s2" x1="60" y1="140" x2="660" y2="140"/>
