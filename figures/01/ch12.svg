<svg viewBox="0 0 720 286" role="img" data-caption="图 12 · 你来当导演：给剧本、划红线、看回放" aria-label="示意图：AI 在读代码、定计划、执行、观察的循环里干活；人的角色是导演，做三件事：给剧本把需求讲清楚，划红线说明什么绝对不能动，看回放验证结果。打字交给 AI。">
