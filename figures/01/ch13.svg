<svg viewBox="0 0 720 274" role="img" data-caption="图 13 · 好需求的万能骨架：背景 · 目标 · 约束 · 例子" aria-label="示意图：左边是差的需求，只有一句话，AI 只能靠猜；右边是好需求的四块骨架，背景、目标、约束、例子，它一次就能做对；另外两招是大活拆小、先要计划再要代码。">
  <text class="tm" x="40" y="34">差的需求</text>
  <rect class="s s2 d" x="40" y="48" width="270" height="76" rx="2"/>
  <text class="t" x="60" y="82">「给管理后台加个搜索」</text>
  <text class="ts" x="60" y="106">剩下的全靠 AI 猜</text>
  <text class="ts" x="40" y="150">猜错一次，你返工一次</text>

  <line class="s s3" x1="40" y1="172" x2="310" y2="172"/>
  <text class="t" x="40" y="198">两招立刻能用</text>
  <text class="ts" x="40" y="222">大活拆小：一次一个可验证的小步</text>
  <text class="ts" x="40" y="244">先要计划，再要代码：看过计划再放行</text>

  <line class="s s3 d" x1="350" y1="30" x2="350" y2="244"/>

  <text class="tm" x="392" y="34">好的需求</text>
  <rect class="s" x="392" y="48" width="288" height="36" rx="2"/>
  <text class="t" x="410" y="71">背景 · 我在做什么，代码在哪</text>
  <rect class="s" x="392" y="90" width="288" height="36" rx="2"/>
  <text class="t" x="410" y="113">目标 · 做成什么样，怎么算成功</text>
  <rect class="s" x="392" y="132" width="288" height="36" rx="2"/>
  <text class="t" x="410" y="155">约束 · 不能动什么，红线在哪</text>
  <rect class="s" x="392" y="174" width="288" height="36" rx="2"/>
  <text class="t" x="410" y="197">例子 · 一组输入和期望输出</text>
  <text class="ts" x="392" y="236">一个好例子顶三段描述，它一次就能做对</text>

  <text class="mk" x="700" y="268" text-anchor="end">stickmancharles.com · CC BY-NC-ND 4.0</text>
</svg>
