<svg viewBox="0 0 720 306" role="img" data-caption="图 15 · 保命的五条底线" aria-label="示意图：一张红线卡，五条底线——秘密进环境变量、永远不要相信前端、数据库必须开 RLS、不要自己发明登录系统、不可逆操作上线前人肉确认。">
  <rect class="s" x="40" y="30" width="640" height="212" rx="2"/>
  <text class="tm" x="62" y="60">保命的五条底线</text>
  <line class="s s3" x1="62" y1="74" x2="658" y2="74"/>

  <text class="tm" x="62" y="106">01</text>
  <text class="t" x="100" y="107">秘密进环境变量，永不进代码</text>
  <text class="ts" x="420" y="107">泄露了就作废换新，别指望删代码有用</text>

  <text class="tm" x="62" y="138">02</text>
  <text class="t" x="100" y="139">永远不要相信前端和用户输入</text>
  <text class="ts" x="420" y="139">验证、权限、金额，后端必须再做一遍</text>

  <text class="tm" x="62" y="170">03</text>
  <text class="t" x="100" y="171">数据库必须开行级权限 RLS</text>
  <text class="ts" x="420" y="171">没开 RLS 的表，约等于向全网公开</text>

  <text class="tm" x="62" y="202">04</text>
  <text class="t" x="100" y="203">永远不要自己发明登录系统</text>
  <text class="ts" x="420" y="203">用现成的 Auth，绝不存明文密码</text>

  <text class="tm" x="62" y="234">05</text>
  <text class="t" x="100" y="235">不可逆操作，上线前人肉确认</text>
  <text class="ts" x="420" y="235">转账 · 铸币 · 群发 · 删生产数据</text>

  <text class="ts" x="40" y="272">「能跑」和「安全」看起来一模一样——不安全的网站照样能打开、能注册、能用，直到出事那天</text>
  <text class="mk" x="700" y="296" text-anchor="end">stickmancharles.com · CC BY-NC-ND 4.0</text>
</svg>
