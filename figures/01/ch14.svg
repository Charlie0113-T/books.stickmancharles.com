<svg viewBox="0 0 720 302" role="img" data-caption="图 14 · 验证金字塔：从底往上查一遍" aria-label="示意图：每次交付按金字塔从底往上查一遍，能跑吗、功能对吗、边界情况、真实用户会遇到什么；大多数翻车翻在边界那一层。报错信息是礼物，原样完整贴给 AI。">
  <path class="s" d="M90,210 L430,210 L400,170 L120,170 Z"/>
  <path class="s" d="M120,170 L400,170 L370,130 L150,130 Z"/>
