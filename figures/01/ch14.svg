  <path class="s" d="M180,90 L340,90 L310,50 L210,50 Z"/>
  <text class="t" x="260" y="195" text-anchor="middle">① 能跑吗</text>
  <text class="t" x="260" y="155" text-anchor="middle">② 功能对吗</text>
  <text class="t" x="260" y="115" text-anchor="middle">③ 边界情况</text>
  <text class="t" x="260" y="75" text-anchor="middle">④ 真实用户</text>
  <text class="ts" x="260" y="234" text-anchor="middle">从底往上，一层层查</text>

