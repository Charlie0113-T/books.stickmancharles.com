<svg viewBox="0 0 720 306" role="img" data-caption="图 9 · 秘密住在代码外面的口袋里" aria-label="示意图：代码天生要流传，会进 Git、上 GitHub；秘密天生不能流传，所以住在 .env 这个代码外面的口袋里，运行时才伸手去摸，而 .gitignore 拦下它，让它永远不会被拍进存档。">
